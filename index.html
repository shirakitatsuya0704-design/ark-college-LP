<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark College | 総合型選抜(AO入試)専門の完全オンライン塾</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 共通設定 --- */
        :root {
            --navy: #0A1628;
            --navy-light: #1a2942;
            --gold: #D4AF37;
            --white: #FFFFFF;
            --off-white: #F8F9FA;
            --gray-light: #E8EBF0;
            --gray: #6B7280;
            --alert-red: #c0392b;
            --line-green: #06C755;
            --accent-orange: #e67e22;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--navy);
            line-height: 1.8;
            background: var(--white);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* --- Hero Section (修正版) --- */
        .hero-impact {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 120px;
            background-color: #050b14;
            
            /* 画像設定：朝日、ノート、ペン、コーヒーのある学習風景 */
            background-image: 
                linear-gradient(rgba(10, 22, 40, 0.5), rgba(10, 22, 40, 0.8)),
                url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=2070&auto=format&fit=crop'); 
            
            background-size: cover;
            background-position: center center; /* 中央寄せ */
            color: white;
        }

        /* 以下、他のスタイルは前回と同じ */
        h1, h2, h3, h4 { font-family: 'Noto Serif JP', serif; font-weight: 700; line-height: 1.4; }
        .text-gold { color: var(--gold); }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }
        .section { padding: 5rem 0; }
        
        /* Header */
        .site-header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 1rem 1.5rem; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-cta-btn {
            background: var(--accent-orange); color: white; padding: 0.6rem 1.2rem;
            border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3); display: flex; align-items: center; gap: 5px;
        }

        /* Hero Content */
        .impact-container {
            max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 1.5rem;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            position: relative; z-index: 2;
        }
        .hero-label {
            font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; color: var(--gold);
            margin-bottom: 1.5rem; display: inline-block; border-bottom: 1px solid var(--gold); padding-bottom: 4px;
        }
        .hero-headline {
            font-family: 'Noto Serif JP', serif; font-size: 4rem; font-weight: 900; line-height: 1.15;
            color: var(--white); margin-bottom: 1.5rem; letter-spacing: -0.02em;
            text-shadow: 0 2px 15px rgba(0,0,0,0.5); /* 文字の影を調整 */
        }
        .hero-headline span.x-mark { color: var(--gold); font-size: 0.7em; vertical-align: middle; margin: 0 0.1rem; }
        .hero-sub {
            font-size: 1.1rem; color: #f0f0f0; margin-bottom: 2rem; font-weight: 500;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Badges */
        .badge-container { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; width: 100%; }
        .hero-badge {
            background: rgba(10, 22, 40, 0.7); border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 0.8rem 1.2rem; border-radius: 4px; color: var(--gold);
            font-weight: 700; font-size: 0.95rem; backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .hero-badge i { font-size: 1.2rem; margin-bottom: 5px; color: #fff; }

        /* CTA Button */
        .hero-actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .btn-hero-cta {
            background: var(--accent-orange); color: #FFFFFF; width: 100%; max-width: 450px;
            padding: 1.2rem; border-radius: 50px; font-size: 1.2rem; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.4); animation: pulse-orange 2s infinite;
            text-decoration: none; line-height: 1.3;
        }
        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(230, 126, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); }
        }
        .btn-main-text { font-weight: 900; font-size: 1.3rem; }
        .btn-sub-text { font-size: 0.85rem; opacity: 0.9; font-weight: normal; }
        .campaign-text-box {
            font-size: 0.9rem; color: #fff; background: var(--alert-red);
            padding: 0.5rem 1.2rem; border-radius: 4px; margin-top: 1rem;
            display: inline-block; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* SP Styles */
        @media (max-width: 768px) {
            .pc-br { display: none; } .sp-br { display: block; }
            .hero-impact { padding-top: 110px; min-height: 650px; }
            .hero-headline { font-size: 2.3rem; }
            .badge-container { gap: 5px; flex-wrap: nowrap; }
            .hero-badge { font-size: 0.65rem; padding: 0.5rem 0.2rem; flex: 1; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="https://www.ark-college.com/" target="_blank" rel="noopener">
            <img src="logo.webp" alt="Ark College" style="height: 40px; width: auto; display: block;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span style="display:none; color:white; font-weight:900; font-size:1.5rem; font-family:'Noto Serif JP';">Ark College</span>
        </a>
        <a href="#contact" class="header-cta-btn">
            <i class="fa-regular fa-calendar-check"></i> <span>無料診断予約</span>
        </a>
    </header>

    <section class="hero-impact" id="top">
        <div class="impact-container">
            <div class="hero-label">総合型選抜(AO入試)専門・完全オンライン私塾</div>
            
            <h1 class="hero-headline">
                添削無制限<br><span class="x-mark">×</span><br>
                完全マンツーマン
            </h1>

            <p class="hero-sub">
                「今の実績で、どこに受かる？」<br>
                慶應FIT合格のプロが、<br class="sp-br">あなたの合格可能性を30分で診断します。
            </p>

            <div class="badge-container">
                <div class="hero-badge"><i class="fa-solid fa-trophy"></i> 第一志望<br>合格率86.7%</div>
                <div class="hero-badge"><i class="fa-solid fa-graduation-cap"></i> 合格大学<br>30校以上</div>
                <div class="hero-badge"><i class="fa-solid fa-user-group"></i> 合格者数<br>50名以上</div>
            </div>

            <div class="hero-actions">
                <a href="#contact" class="btn-hero-cta">
                    <span class="btn-sub-text">まずは30分、現状をお聞かせください</span>
                    <span class="btn-main-text">無料の「合格可能性診断」を予約する</span>
                </a>
                
                <div class="campaign-text-box">
                    <i class="fa-solid fa-gift"></i> 【今だけ】当日入会で入会金 55,000円 → 0円
                </div>
            </div>
        </div>
    </section>

    <div style="background:var(--navy); color:white; padding:2rem; text-align:center; margin-top:5rem;">
        (コンテンツエリア)
    </div>
</body>
</html>
